name: Delete Old Workflow Runs (Keep Latest Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 4 AM UTC

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Required to list and delete workflow runs
      contents: read
    steps:
      - name: Delete all workflow runs except the latest one
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          keep: 1  # Keeps only the most recent run per workflow
